<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход в CRM 3.0</title></head>
<body>
<main>
  <h1>Подключение CRM 3.0 к ChatGPT</h1>
  <p>Войдите под своей учётной записью CRM.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Войти</button>
  </form>
</main>
</body>
</html>
